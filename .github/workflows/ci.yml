name: CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [pod-ci, ci-multiserver-validation]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Pre-commit hooks (format, lint, clang-tidy) ----------
  pre-commit:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build and lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang-tidy

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package (for pyright C extension symbol resolution)
        run: pip install .

      - name: Cache cmake build directories
        uses: actions/cache@v5
        with:
          path: build/cache
          key: cmake-sim-${{ runner.os }}-${{ hashFiles('src/**/CMakeLists.txt', 'src/**/build_config.py', 'simpler_setup/runtime_compiler.py', 'simpler_setup/kernel_compiler.py', 'simpler_setup/toolchain.py') }}
          restore-keys: |
            cmake-sim-${{ runner.os }}-

      - name: Build sim runtimes (generates per-target compile_commands.json)
        run: python simpler_setup/build_runtimes.py --platforms a2a3sim a5sim

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.0
        with:
          extra_args: --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.event.pull_request.head.sha }}

  # ---------- Packaging matrix: 5 install paths × 4 entry points, on macOS + Ubuntu ----------
  # Smoke-checks that every supported install path exposes the four user entry points.
  # Each mode is wiped to a fully clean state (no caches) so a previous mode's
  # build artifacts cannot mask a regression in the next mode. Slow but reliable.
  # See docs/python-packaging.md and tools/verify_packaging.sh.
  packaging-matrix:
    needs: [detect-changes, pre-commit]
    if: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up C++ compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Set up C++ compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja cmake
          brew install gcc@15 || brew install gcc

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build + runtime deps in venv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install scikit-build-core nanobind cmake pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run packaging matrix (5 modes × 4 entry points, fully isolated)
        run: |
          . .venv/bin/activate
          bash tools/verify_packaging.sh

  # ---------- Unit tests (no hardware, Python + C++) ----------
  ut:
    needs: [detect-changes, pre-commit]
    if: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GoogleTest (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtest-dev
          cd /usr/src/googletest
          sudo cmake -B build
          sudo cmake --build build
          sudo cmake --install build

      - name: Install GoogleTest (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install googletest

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install '.[test]'

      - name: Run Python unit tests
        run: pytest tests/ut -m "not requires_hardware" -v

      - name: Build and run C++ unit tests
        run: |
          cmake -B tests/ut/cpp/build -S tests/ut/cpp
          cmake --build tests/ut/cpp/build
          ctest --test-dir tests/ut/cpp/build -LE requires_hardware --output-on-failure

  # ---------- Simulation scene tests ----------
  st-sim-a2a3:
    needs: [detect-changes, pre-commit]
    if: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SIMPLER_SCHEDULER_TIMEOUT_MS: "5000"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up C++ compiler
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y ninja-build
            sudo apt-get install -y g++-15 || sudo apt-get install -y g++
            if ! command -v g++-15; then sudo ln -s $(which g++) /usr/local/bin/g++-15; fi
            # graphviz: required by the dep_gen smoke (deps_viewer -> dot).
            # Both a2a3 and a5 sim jobs run dep_gen, so install it in both.
            sudo apt-get install -y graphviz
          else
            brew install ninja
            brew install gcc@15 || brew install gcc
            brew install graphviz
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install '.[test]'

      - name: Run pytest scene tests (a2a3sim)
        run: |
          pytest examples tests/st --platform a2a3sim --device 0-15 -v \
            --pto-session-timeout 600 --require-pto-isa

      # DFX per-feature smokes — the default pytest above passes no --enable-*
      # flag, so each capture pipeline gets its own invocation here. Kept as
      # separate steps so a failing capture pipeline is attributed to its own
      # CI step rather than buried in a combined run.
      - name: dep_gen smoke
        run: |
          pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/dep_gen/test_dep_gen.py \
            --platform a2a3sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --enable-dep-gen

      # host_build_graph captures its graph on the host orchestrator instead of
      # replaying a device ring, so it is a separate capture pipeline and gets
      # its own step. One runtime per invocation: a single pytest spanning both
      # makes the scene-test scheduler spawn a child run per runtime, and those
      # children take xdist args that `-p no:xdist` has disabled.
      - name: dep_gen smoke (host_build_graph)
        run: |
          pytest tests/st/a2a3/host_build_graph/dfx/dep_gen/test_dep_gen.py \
            --platform a2a3sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --enable-dep-gen

      - name: l2_swimlane smoke
        run: |
          pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/l2_swimlane/ \
            --platform a2a3sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --enable-l2-swimlane --enable-dep-gen

      - name: PMU smoke
        run: |
          pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/pmu/test_pmu.py \
            --platform a2a3sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --enable-pmu 2

      - name: args_dump smoke
        run: |
          pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/args_dump/test_args_dump.py \
            --platform a2a3sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --dump-args

  st-sim-a5:
    needs: [detect-changes, pre-commit]
    if: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      SIMPLER_SCHEDULER_TIMEOUT_MS: "5000"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up C++ compiler
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y ninja-build
            sudo apt-get install -y g++-15 || sudo apt-get install -y g++
            if ! command -v g++-15; then sudo ln -s $(which g++) /usr/local/bin/g++-15; fi
            # graphviz: required by the dep_gen smoke (deps_viewer -> dot).
            # Both a2a3 and a5 sim jobs run dep_gen, so install it in both.
            sudo apt-get install -y graphviz
          else
            brew install ninja
            brew install gcc@15 || brew install gcc
            brew install graphviz
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install '.[test]'

      - name: Run pytest scene tests (a5sim)
        run: |
          pytest examples tests/st --platform a5sim --device 0-15 -v \
            --pto-session-timeout 600 --require-pto-isa

      # DFX per-feature smokes — the default pytest above passes no --enable-*
      # flag, so each capture pipeline gets its own invocation here. Kept as
      # separate steps so a failing capture pipeline is attributed to its own
      # CI step rather than buried in a combined run. Mirrors st-sim-a2a3.
      - name: dep_gen smoke
        run: |
          pytest tests/st/a5/tensormap_and_ringbuffer/dfx/dep_gen/test_dep_gen.py \
            --platform a5sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --enable-dep-gen

      - name: l2_swimlane smoke
        run: |
          pytest tests/st/a5/tensormap_and_ringbuffer/dfx/l2_swimlane/ \
            --platform a5sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --enable-l2-swimlane --enable-dep-gen

      - name: PMU smoke
        run: |
          pytest tests/st/a5/tensormap_and_ringbuffer/dfx/pmu/test_pmu.py \
            --platform a5sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --enable-pmu 2

      - name: args_dump smoke
        run: |
          pytest tests/st/a5/tensormap_and_ringbuffer/dfx/args_dump/test_args_dump.py \
            --platform a5sim --device 0-15 -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --dump-args

  # ---------- Profiling sub-flags smoke (compile + run) ----------
  # SIMPLER_DFX / SIMPLER_ORCH_PROFILING / SIMPLER_SCHED_PROFILING /
  # SIMPLER_TENSORMAP_PROFILING are compile-time gates whose defaults and
  # dependency checks live in src/common/task_interface/profiling_config.h.
  # The defaults (SIMPLER_DFX=1, sub-flags=0) are exercised by every CI job,
  # but non-default branches are otherwise dead coverage: a developer flipping
  # any of them for perf debugging or to minimize logging overhead had no gate
  # protecting the gated code from drift (renamed fields, changed signatures,
  # format-string mismatches in LOG_INFO summaries, dead parameters caught
  # only by -Wunused-parameter -Werror).
  #
  # All combos run sequentially in a single job (not a matrix) so the
  # apt/python/pip setup cost is paid once, not 12×. Failures across combos
  # are accumulated and reported together at the end — first failure does
  # not abort the rest.
  #
  # Combos walk the macro hierarchy explicitly (not just "all on" or "all
  # off") so log scrubbing the failing leg pinpoints the specific gate:
  #
  #   SIMPLER_DFX (default=1, covered by every other CI job)
  #   ├── dfx-off:         -DSIMPLER_DFX=0   (no profiling at all)
  #   ├── orch:             -DSIMPLER_ORCH_PROFILING=1
  #   │   └── orch-tensormap:  + -DSIMPLER_TENSORMAP_PROFILING=1
  #   ├── sched:            -DSIMPLER_SCHED_PROFILING=1
  #   ├── orch-sched:       ORCH=1 + SCHED=1   (both sub-flags on, tensormap off)
  #   └── all-on:           ORCH=1 + SCHED=1 + TENSORMAP=1
  #
  # Each combo rebuilds the sim runtime with its CXXFLAGS and runs the
  # smallest full-pipeline example (vector_example) — exercises orchestrator,
  # scheduler, AICore dispatch, and completion paths gated by the macros.
  #
  # Verified locally that each combo's compile_commands.json contains *only*
  # its declared -D flags, the resulting libaicpu_kernel.so contains *only*
  # the matching profiling log strings, and pytest output emits *only* the
  # corresponding profiling block — no cross-contamination from cmake cache.
  profiling-flags-smoke:
    needs: [detect-changes, pre-commit]
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up C++ compiler
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y ninja-build
          sudo apt-get install -y g++-15 || sudo apt-get install -y g++
          if ! command -v g++-15; then sudo ln -s "$(which g++)" /usr/local/bin/g++-15; fi

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (editable so simpler_setup always resolves to source tree)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Editable install (`-e .`) avoids a cwd-dependent footgun: with a
          # plain wheel install, `import simpler_setup` from a non-source-tree
          # cwd resolves to the wheel-internal copy (PROJECT_ROOT = _assets/),
          # silently reading runtime .so files from the wheel instead of the
          # build/lib/ that our combo loop overwrites. With editable mode the
          # shim always redirects to source-tree paths, regardless of cwd.
          # pyproject.toml sets editable.rebuild=false so import-time auto
          # rebuilds cannot clobber our profiling-on binaries.
          #
          # Build isolation (pip default, no --no-build-isolation) pulls
          # scikit-build-core into a throwaway env automatically — matches the
          # `pre-commit` job's `pip install .` pattern and works on a fresh
          # CI runner that has no build deps pre-installed.
          pip install -e '.[test]'

      - name: Run all profiling flag combos × 2 arches
        run: |
          # Combo names paired with their CXX defines. Parallel arrays (not
          # an associative array) so the loop iteration order is deterministic
          # and the log reads top-to-bottom in hierarchy order.
          COMBO_NAMES=(dfx-off orch orch-tensormap sched orch-sched all-on)
          COMBO_DEFS=(
            "-DSIMPLER_DFX=0"
            "-DSIMPLER_ORCH_PROFILING=1"
            "-DSIMPLER_ORCH_PROFILING=1 -DSIMPLER_TENSORMAP_PROFILING=1"
            "-DSIMPLER_SCHED_PROFILING=1"
            "-DSIMPLER_ORCH_PROFILING=1 -DSIMPLER_SCHED_PROFILING=1"
            "-DSIMPLER_ORCH_PROFILING=1 -DSIMPLER_SCHED_PROFILING=1 -DSIMPLER_TENSORMAP_PROFILING=1"
          )
          ARCHES=(a2a3sim a5sim)
          FAIL=()

          for ARCH in "${ARCHES[@]}"; do
            ARCH_DIR=${ARCH%sim}
            for i in "${!COMBO_NAMES[@]}"; do
              NAME=${COMBO_NAMES[$i]}
              DEFS=${COMBO_DEFS[$i]}
              echo "::group::$ARCH / $NAME — CXX defines: $DEFS"
              if ! CXX="g++ $DEFS" python simpler_setup/build_runtimes.py --platforms "$ARCH"; then
                echo "::error::Build failed: $ARCH / $NAME"
                FAIL+=("$ARCH/$NAME (build)")
                echo "::endgroup::"
                continue
              fi
              if ! python -m pytest \
                   "examples/${ARCH_DIR}/tensormap_and_ringbuffer/vector_example/test_vector_example.py" \
                   --platform "$ARCH" --device 0-1 -p no:xdist \
                   --pto-session-timeout 600; then
                echo "::error::Smoke failed: $ARCH / $NAME"
                FAIL+=("$ARCH/$NAME (pytest)")
              fi
              echo "::endgroup::"
            done
          done

          echo ""
          echo "==== SUMMARY ===="
          if [ ${#FAIL[@]} -gt 0 ]; then
            printf 'FAILED: %s\n' "${FAIL[@]}"
            exit 1
          fi
          echo "All $((${#COMBO_NAMES[@]} * ${#ARCHES[@]})) combos passed."

  # ---------- Unit tests (a2a3 hardware, Python + C++) ----------
  ut-a2a3:
    needs: [detect-changes, pre-commit]
    if: false
    runs-on: [self-hosted, a2a3]
    timeout-minutes: 30
    env:
      SIMPLER_SCHEDULER_TIMEOUT_MS: "2000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "3000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "4000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up environment
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          python3 -m venv --system-site-packages .venv
          source .venv/bin/activate
          pip install --upgrade pip
          # The host_runtime build and test-time kernels both resolve PTO-ISA
          # from pto_isa.pin, so they share one ISA revision.
          pip install '.[test]'

      - name: Run Python hardware unit tests
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          source .venv/bin/activate
          if [ "$(uname -m)" = "x86_64" ]; then
            python -m pytest tests -m requires_hardware --platform a2a3 --device ${DEVICE_RANGE} -v
          else
            task-submit --timeout 1800 --max-time 1800 --device auto --device-num "$DEVICE_NUM" \
              --run "python -m pytest tests -m requires_hardware --platform a2a3 --device \$TASK_DEVICE -v"
          fi

      - name: Build and run C++ hardware unit tests
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          source .venv/bin/activate
          python -c "from simpler_setup.runtime_builder import RuntimeBuilder; RuntimeBuilder('a2a3').get_binaries('tensormap_and_ringbuffer', build=True)"
          cmake -B tests/ut/cpp/build -S tests/ut/cpp -DSIMPLER_ENABLE_HARDWARE_TESTS=ON
          cmake --build tests/ut/cpp/build
          if [ "$(uname -m)" = "x86_64" ]; then
            python3 -c "
          import json, os
          p = os.environ['DEVICE_RANGE'].split('-'); s, e = p[0], p[-1]  # tolerate a single id (no hyphen)
          npus = [{'id': str(i), 'slots': 1} for i in range(int(s), int(e)+1)]
          json.dump({'version': {'major': 1, 'minor': 0}, 'local': [{'npus': npus}]},
                    open('tests/ut/cpp/build/resources.json', 'w'))
          "
            ctest --test-dir tests/ut/cpp/build -L '^requires_hardware(_a2a3)?$' --resource-spec-file $PWD/tests/ut/cpp/build/resources.json -j$(nproc) --output-on-failure
          else
            task-submit --timeout 1800 --max-time 1800 --device auto --device-num "$DEVICE_NUM" \
              --run "python3 -c \"import json,os; ids=os.environ['TASK_DEVICE'].split(','); json.dump({'version':{'major':1,'minor':0},'local':[{'npus':[{'id':i,'slots':1} for i in ids]}]}, open('tests/ut/cpp/build/resources.json','w'))\" && ctest --test-dir tests/ut/cpp/build -L '^requires_hardware(_a2a3)?\$' --resource-spec-file $PWD/tests/ut/cpp/build/resources.json -j$(nproc) --output-on-failure"
          fi

      - name: Build cann-examples/query (CANN host-API smoke)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          cd tools/cann-examples/query
          cmake -B build .
          cmake --build build
          ./build/query version

      - name: Build cann-examples/aicpu-device-query (device-side HAL probe smoke)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          export CROSS=${ASCEND_HOME_PATH}/tools/hcc/bin/aarch64-target-linux-gnu
          cd tools/cann-examples/aicpu-device-query/device
          cmake -B build . -DCMAKE_C_COMPILER=${CROSS}-gcc -DCMAKE_CXX_COMPILER=${CROSS}-g++
          cmake --build build
          cd ../host
          cmake -B build .
          cmake --build build

      - name: Build cann-examples/aicpu-kernel-launch (dispatcher bootstrap smoke)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          export CROSS=${ASCEND_HOME_PATH}/tools/hcc/bin/aarch64-target-linux-gnu
          cd tools/cann-examples/aicpu-kernel-launch/device
          cmake -B build . -DCMAKE_C_COMPILER=${CROSS}-gcc -DCMAKE_CXX_COMPILER=${CROSS}-g++
          cmake --build build
          cd ../host
          cmake -B build .
          cmake --build build

  # ---------- Scene tests (a2a3 hardware) ----------
  st-onboard-a2a3:
    needs: [detect-changes, pre-commit]
    if: false
    runs-on: [self-hosted, a2a3]
    timeout-minutes: 60
    env:
      SIMPLER_SCHEDULER_TIMEOUT_MS: "2000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "3000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "4000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up environment
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          python3 -m venv --system-site-packages .venv
          source .venv/bin/activate
          pip install --upgrade pip
          # The host_runtime build and test-time kernels both resolve PTO-ISA
          # from pto_isa.pin, so they share one ISA revision.
          pip install '.[test]'
          # Warn if graphviz isn't installed on the runner — the dep_gen
          # smoke step needs `dot` to render deps_viewer. The Python
          # has_binary("dot") guard in the test will skip cleanly without
          # it, but coverage drops, so flag it loudly here.
          if ! command -v dot >/dev/null 2>&1; then
            echo "::warning::graphviz 'dot' not found on PATH; deps_viewer tool smoke will skip. Install graphviz on this self-hosted runner to restore coverage."
          fi

      - name: Run pytest scene tests (a2a3)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          source .venv/bin/activate
          # SDMA workloads provision 48 device-only STARS streams that sit in the
          # device fault/sync domain, so a fault on that device pays a multi-minute
          # teardown (issue #1425). Keep EVERY SDMA test out of this general sweep
          # — which also runs the aicore_op_timeout fault-injection test — and run
          # them on their own dedicated device(s) in the SDMA step below, so an
          # SDMA fault's slow teardown can never mix with ordinary fault recovery.
          SDMA_IGNORE="--ignore=examples/a2a3/tensormap_and_ringbuffer/prefetch_async_demo --ignore=examples/a2a3/tensormap_and_ringbuffer/sdma_async_completion_demo"
          # qwen3_14b_decode runs all 40 Qwen3-14B decode layers against a 38 GiB
          # fixture and takes ~5 min on its own — over half this sweep's 600 s
          # session budget. It gets its own step below with its own budget, so the
          # short timeout here keeps its job: catching a genuine hang.
          HEAVY_IGNORE="--ignore=examples/a2a3/tensormap_and_ringbuffer/qwen3_14b_decode"
          if [ "$(uname -m)" = "x86_64" ]; then
            python -m pytest examples tests/st $SDMA_IGNORE $HEAVY_IGNORE --platform a2a3 --device ${DEVICE_RANGE} -v --require-pto-isa --pto-session-timeout 600
          else
            task-submit --timeout 1800 --max-time 1800 --device auto --device-num "$DEVICE_NUM" \
              --run "python -m pytest examples tests/st $SDMA_IGNORE $HEAVY_IGNORE --platform a2a3 --device \$TASK_DEVICE -v --require-pto-isa --pto-session-timeout 600"
          fi

      # qwen3_14b_decode is the full 40-layer Qwen3-14B decode — a 38 GiB fixture
      # (x40-stacked weights + paged KV) and ~5 min wall. It runs here on its own
      # device with its own session budget rather than eating the general sweep's.
      - name: Qwen3-14B 40-layer decode (a2a3)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          source .venv/bin/activate
          QWEN_TEST="examples/a2a3/tensormap_and_ringbuffer/qwen3_14b_decode"
          if [ "$(uname -m)" = "x86_64" ]; then
            python -m pytest $QWEN_TEST --platform a2a3 --device ${DEVICE_RANGE} -v --require-pto-isa --pto-session-timeout 1800
          else
            task-submit --timeout 3600 --max-time 3600 --device auto --device-num 1 \
              --run "python -m pytest $QWEN_TEST --platform a2a3 --device \$TASK_DEVICE -v --require-pto-isa --pto-session-timeout 1800"
          fi

      # SDMA pytest — every SDMA test runs here on its own dedicated device(s),
      # isolated from the general sweep's aicore_op_timeout fault-injection test
      # (issue #1425). Both demos create their Worker with enable_sdma=True so the
      # runtime provisions the SDMA workspace: prefetch_async_demo on 1 device (L2),
      # sdma_async_completion_demo on 2 devices (L3, workspace provisioned per chip
      # child) with a comm domain for the peer windows.
      - name: SDMA pytest (a2a3)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          source .venv/bin/activate
          SDMA_TESTS="examples/a2a3/tensormap_and_ringbuffer/prefetch_async_demo examples/a2a3/tensormap_and_ringbuffer/sdma_async_completion_demo"
          if [ "$(uname -m)" = "x86_64" ]; then
            python -m pytest $SDMA_TESTS --platform a2a3 --device ${DEVICE_RANGE} -v --require-pto-isa --pto-session-timeout 600
          else
            task-submit --timeout 1800 --max-time 1800 --device auto --device-num 2 \
              --run "python -m pytest $SDMA_TESTS --platform a2a3 --device \$TASK_DEVICE -v --require-pto-isa --pto-session-timeout 600"
          fi

      # DFX per-feature smokes — hardware mirror of the st-sim-a2a3 set. The
      # race window in dep_gen only fires on real timing, so this row is
      # what would catch onboard-only regressions like the missing kernel.cpp
      # propagation #742 fixed.
      - name: dep_gen smoke
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          source .venv/bin/activate
          if [ "$(uname -m)" = "x86_64" ]; then
            python -m pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/dep_gen/test_dep_gen.py \
              --platform a2a3 --device ${DEVICE_RANGE} -p no:xdist --pto-session-timeout 600 \
              --require-pto-isa --enable-dep-gen
          else
            task-submit --timeout 1800 --max-time 1800 --device auto --device-num "$DEVICE_NUM" \
              --run "python -m pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/dep_gen/test_dep_gen.py \
              --platform a2a3 --device \$TASK_DEVICE -p no:xdist --pto-session-timeout 600 \
              --require-pto-isa --enable-dep-gen"
          fi

      # Hardware mirror of the sim job's host_build_graph dep_gen step; one
      # runtime per invocation for the same reason (a single pytest spanning both
      # spawns per-runtime children that `-p no:xdist` breaks).
      - name: dep_gen smoke (host_build_graph)
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          source .venv/bin/activate
          if [ "$(uname -m)" = "x86_64" ]; then
            python -m pytest tests/st/a2a3/host_build_graph/dfx/dep_gen/test_dep_gen.py \
              --platform a2a3 --device ${DEVICE_RANGE} -p no:xdist --pto-session-timeout 600 \
              --require-pto-isa --enable-dep-gen
          else
            task-submit --timeout 1800 --max-time 1800 --device auto --device-num "$DEVICE_NUM" \
              --run "python -m pytest tests/st/a2a3/host_build_graph/dfx/dep_gen/test_dep_gen.py \
              --platform a2a3 --device \$TASK_DEVICE -p no:xdist --pto-session-timeout 600 \
              --require-pto-isa --enable-dep-gen"
          fi

      - name: l2_swimlane smoke
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          source .venv/bin/activate
          if [ "$(uname -m)" = "x86_64" ]; then
            python -m pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/l2_swimlane/ \
              --platform a2a3 --device ${DEVICE_RANGE} -p no:xdist --pto-session-timeout 600 \
              --require-pto-isa --enable-l2-swimlane --enable-dep-gen
          else
            task-submit --timeout 1800 --max-time 1800 --device auto --device-num "$DEVICE_NUM" \
              --run "python -m pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/l2_swimlane/ \
              --platform a2a3 --device \$TASK_DEVICE -p no:xdist --pto-session-timeout 600 \
              --require-pto-isa --enable-l2-swimlane --enable-dep-gen"
          fi

      - name: PMU smoke
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          source .venv/bin/activate
          if [ "$(uname -m)" = "x86_64" ]; then
            python -m pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/pmu/test_pmu.py \
              --platform a2a3 --device ${DEVICE_RANGE} -p no:xdist --pto-session-timeout 600 \
              --require-pto-isa --enable-pmu 2
          else
            task-submit --timeout 1800 --max-time 1800 --device auto --device-num "$DEVICE_NUM" \
              --run "python -m pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/pmu/test_pmu.py \
              --platform a2a3 --device \$TASK_DEVICE -p no:xdist --pto-session-timeout 600 \
              --require-pto-isa --enable-pmu 2"
          fi

      - name: args_dump smoke
        run: |
          source /usr/local/Ascend/cann/set_env.sh
          source .venv/bin/activate
          if [ "$(uname -m)" = "x86_64" ]; then
            python -m pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/args_dump/test_args_dump.py \
              --platform a2a3 --device ${DEVICE_RANGE} -p no:xdist --pto-session-timeout 600 \
              --require-pto-isa --dump-args
          else
            task-submit --timeout 1800 --max-time 1800 --device auto --device-num "$DEVICE_NUM" \
              --run "python -m pytest tests/st/a2a3/tensormap_and_ringbuffer/dfx/args_dump/test_args_dump.py \
              --platform a2a3 --device \$TASK_DEVICE -p no:xdist --pto-session-timeout 600 \
              --require-pto-isa --dump-args"
          fi

  # ---------- Scene tests (a2a3 hardware, multi-machine pod runner) ----------
  # Runs on a pair of self-hosted a2a3 machines. Every value that identifies a
  # machine — addresses, device split, ports, staging root, proxy — comes from
  # the runner's own .env, loaded by the first step. Nothing machine-specific
  # belongs in this file.
  st-pod-onboard-a2a3:
    runs-on: [self-hosted, Linux, ARM64, pod-a2a3]
    timeout-minutes: 60
    env:
      SIMPLER_SCHEDULER_TIMEOUT_MS: "2000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "3000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "4000"

    steps:
      # Each pod machine carries one .env describing itself and its peer, so
      # this job never has to work out which machine it landed on. Runs before
      # checkout so the proxy settings are available to every later step.
      - name: Load pod machine config
        run: |
          set -euo pipefail

          # The runner root holds .env and sits two levels above
          # RUNNER_WORKSPACE (<root>/_work/<repo>). POD_ENV_FILE overrides the
          # derivation for a runner laid out differently.
          ENV_FILE="${POD_ENV_FILE:-$(dirname "$(dirname "$RUNNER_WORKSPACE")")/.env}"
          if [ ! -r "$ENV_FILE" ]; then
            echo "::error::pod config not readable: $ENV_FILE (set POD_ENV_FILE to override)"
            exit 1
          fi
          echo "pod config: $ENV_FILE"

          # The runner service reads this same file for its own settings, so
          # only POD_* is accepted here — an unrelated key in it must not reach
          # the job environment through this step.
          while IFS= read -r line || [ -n "$line" ]; do
            line=${line%$'\r'}
            line=${line#"${line%%[![:space:]]*}"}
            case "$line" in ''|'#'*) continue ;; esac
            [[ "$line" == *=* ]] || continue
            key=${line%%=*}
            value=${line#*=}
            [[ "$key" =~ ^POD_[A-Z0-9_]+$ ]] || continue
            value=${value%"${value##*[![:space:]]}"}
            case "$value" in
              \"*\") value=${value#\"}; value=${value%\"} ;;
              \'*\') value=${value#\'}; value=${value%\'} ;;
            esac
            printf -v "$key" '%s' "$value"
          done < "$ENV_FILE"

          set_default() {
            local name=$1
            shift
            [ -n "${!name-}" ] || printf -v "$name" '%s' "$*"
          }
          set_default POD_LOCAL_IP ""
          set_default POD_REMOTE_USER ""
          set_default POD_REMOTE_SSH_PORT 22
          set_default POD_L3_DAEMON_PORT 19073
          set_default POD_L3_SESSION_TIMEOUT_S 180
          set_default POD_L3_SESSION_LISTEN_HOST 0.0.0.0
          set_default POD_REMOTE_STAGING_ROOT /data/workspace/ci-runner/pod-ci
          set_default POD_REMOTE_STAGING_TTL_DAYS 2
          set_default POD_DAEMON_WAIT_S 120
          set_default POD_SMOKE_TIMEOUT_S 1800
          set_default POD_CANN_ENV /usr/local/Ascend/cann/set_env.sh
          set_default POD_REMOTE_CANN_ENV "$POD_CANN_ENV"
          set_default POD_HTTP_PROXY ""
          set_default POD_HTTPS_PROXY ""
          set_default POD_NO_PROXY ""
          # Each machine runs its own proxy on its own port, and the peer's
          # values are evaluated on the peer — a loopback address here and
          # there name two different proxies. Unset means "same as this
          # machine's", which only holds for a shared LAN proxy.
          set_default POD_REMOTE_HTTP_PROXY "$POD_HTTP_PROXY"
          set_default POD_REMOTE_HTTPS_PROXY "$POD_HTTPS_PROXY"
          set_default POD_REMOTE_NO_PROXY "$POD_NO_PROXY"

          # A proxy nothing listens on turns every pip call into five retries
          # ending in an opaque ProxyError, several steps from the setting that
          # caused it. Name the address here instead.
          proxy_reachable() {
            local hostport=${1#*://} host port
            hostport=${hostport##*@}
            hostport=${hostport%%/*}
            host=${hostport%:*}
            port=${hostport##*:}
            [ "$host" != "$port" ] || port=80
            (exec 3<>"/dev/tcp/$host/$port") 2>/dev/null
          }
          for key in POD_HTTP_PROXY POD_HTTPS_PROXY; do
            if [ -n "${!key}" ] && ! proxy_reachable "${!key}"; then
              echo "::error::$key=${!key} is not reachable from this machine"
              exit 1
            fi
          done

          MISSING=0
          for key in POD_MACHINE POD_LOCAL_DEVICES POD_REMOTE_MACHINE POD_REMOTE_HOST POD_REMOTE_DEVICES; do
            if [ -z "${!key-}" ]; then
              echo "::error::$key is missing from $ENV_FILE"
              MISSING=1
            fi
          done
          [ "$MISSING" = 0 ] || exit 1

          # The file is the source of truth for identity; this only catches the
          # wrong machine's .env having been copied onto this runner.
          if [ -n "$POD_LOCAL_IP" ] && ! hostname -I | tr ' ' '\n' | grep -qx "$POD_LOCAL_IP"; then
            echo "::error::POD_LOCAL_IP=$POD_LOCAL_IP is not an address of this host"
            hostname -I || true
            exit 1
          fi

          for key in POD_MACHINE POD_LOCAL_IP POD_LOCAL_DEVICES \
                     POD_REMOTE_MACHINE POD_REMOTE_HOST POD_REMOTE_DEVICES \
                     POD_REMOTE_USER POD_REMOTE_SSH_PORT \
                     POD_L3_DAEMON_PORT POD_L3_SESSION_TIMEOUT_S POD_L3_SESSION_LISTEN_HOST \
                     POD_REMOTE_STAGING_ROOT POD_REMOTE_STAGING_TTL_DAYS \
                     POD_DAEMON_WAIT_S POD_SMOKE_TIMEOUT_S \
                     POD_CANN_ENV POD_REMOTE_CANN_ENV \
                     POD_HTTP_PROXY POD_HTTPS_PROXY POD_NO_PROXY \
                     POD_REMOTE_HTTP_PROXY POD_REMOTE_HTTPS_PROXY POD_REMOTE_NO_PROXY; do
            printf '%s=%s\n' "$key" "${!key-}" >> "$GITHUB_ENV"
          done

          echo "pod machine=${POD_MACHINE} ip=${POD_LOCAL_IP:-unset} devices=${POD_LOCAL_DEVICES}"
          echo "pod peer=${POD_REMOTE_MACHINE} host=${POD_REMOTE_HOST}:${POD_REMOTE_SSH_PORT} devices=${POD_REMOTE_DEVICES}"

      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up environment
        run: |
          source "$POD_CANN_ENV"
          # Proxy is applied to the pip steps only, not exported job-wide: the
          # runner already reaches GitHub without it, and routing the actions
          # through it would put an untested hop in front of checkout.
          export http_proxy="$POD_HTTP_PROXY" https_proxy="$POD_HTTPS_PROXY" no_proxy="$POD_NO_PROXY"
          export HTTP_PROXY="$POD_HTTP_PROXY" HTTPS_PROXY="$POD_HTTPS_PROXY" NO_PROXY="$POD_NO_PROXY"
          python3 -m venv --system-site-packages .venv
          source .venv/bin/activate
          pip install --upgrade pip
          # The host_runtime build and test-time kernels both resolve PTO-ISA
          # from pto_isa.pin, so they share one ISA revision.
          pip install '.[test]'
          # Warn if graphviz isn't installed on the runner — the dep_gen
          # smoke step needs `dot` to render deps_viewer. The Python
          # has_binary("dot") guard in the test will skip cleanly without
          # it, but coverage drops, so flag it loudly here.
          if ! command -v dot >/dev/null 2>&1; then
            echo "::warning::graphviz 'dot' not found on PATH; deps_viewer tool smoke will skip. Install graphviz on this self-hosted runner to restore coverage."
          fi

      - name: vector_add_mixed_l3 mixed local/remote (a2a3)
        run: |
          set -eo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          export CMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}"
          source "$POD_CANN_ENV"
          source .venv/bin/activate
          set -u
          if ! command -v rsync >/dev/null 2>&1; then
            echo "::error::rsync is required on the pod runner for remote checkout sync"
            exit 1
          fi

          REMOTE_DAEMON_HOST="$POD_REMOTE_HOST"
          REMOTE_DAEMON_PORT="$POD_L3_DAEMON_PORT"
          REMOTE_TARGET="${POD_REMOTE_USER:+$POD_REMOTE_USER@}$POD_REMOTE_HOST"
          REMOTE_WORKDIR="$POD_REMOTE_STAGING_ROOT/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The peer's proxy is only reachable from the peer, so its liveness
          # check has to run there; split the address here where the parsing
          # is readable.
          REMOTE_PROXY_HOST=""
          REMOTE_PROXY_PORT=""
          if [ -n "$POD_REMOTE_HTTP_PROXY" ]; then
            REMOTE_PROXY_HOSTPORT=${POD_REMOTE_HTTP_PROXY#*://}
            REMOTE_PROXY_HOSTPORT=${REMOTE_PROXY_HOSTPORT##*@}
            REMOTE_PROXY_HOSTPORT=${REMOTE_PROXY_HOSTPORT%%/*}
            REMOTE_PROXY_HOST=${REMOTE_PROXY_HOSTPORT%:*}
            REMOTE_PROXY_PORT=${REMOTE_PROXY_HOSTPORT##*:}
            [ "$REMOTE_PROXY_HOST" != "$REMOTE_PROXY_PORT" ] || REMOTE_PROXY_PORT=80
          fi
          RUN_DIR="$GITHUB_WORKSPACE/output/vector_add_mixed_l3/pod-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "vector_add_mixed_l3 parent=${POD_MACHINE} local=${POD_LOCAL_DEVICES} daemon=${POD_REMOTE_MACHINE} remote=${POD_REMOTE_DEVICES}"

          mkdir -p "$RUN_DIR/parent-${POD_MACHINE}/ascend" "$RUN_DIR/daemon-${POD_REMOTE_MACHINE}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          touch "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keyscan -H -p "$POD_REMOTE_SSH_PORT" "$POD_REMOTE_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
          SSH_OPTS=(-p "$POD_REMOTE_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          RSYNC_SSH="ssh -p $POD_REMOTE_SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts"

          cleanup() {
            set +e
            if [ -n "${REMOTE_SSH_PID:-}" ]; then
              kill "$REMOTE_SSH_PID" 2>/dev/null || true
              wait "$REMOTE_SSH_PID" 2>/dev/null || true
            fi
            # The daemon's chip children keep writing into the workdir after the
            # daemon itself is signalled, and rm -rf on a tree still being
            # written fails with ENOTEMPTY — so wait for the daemon to actually
            # go before removing, and retry once for a straggler.
            ssh "${SSH_OPTS[@]}" "$REMOTE_TARGET" "
              pkill -f 'python -m simpler.remote_l3_worker --host ${REMOTE_DAEMON_HOST} --port ${REMOTE_DAEMON_PORT}' || true
              for _ in \$(seq 1 20); do
                pgrep -f 'python -m simpler.remote_l3_worker --host ${REMOTE_DAEMON_HOST} --port ${REMOTE_DAEMON_PORT}' >/dev/null || break
                sleep 0.5
              done
            " || true
            rsync -a -e "$RSYNC_SSH" "$REMOTE_TARGET:$REMOTE_WORKDIR/output/vector_add_mixed_l3/daemon-${POD_REMOTE_MACHINE}/" \
              "$RUN_DIR/daemon-${POD_REMOTE_MACHINE}/" 2>/dev/null || true
            ssh "${SSH_OPTS[@]}" "$REMOTE_TARGET" \
              "rm -rf '$REMOTE_WORKDIR' 2>/dev/null || { sleep 5; rm -rf '$REMOTE_WORKDIR'; }" || true
          }
          trap cleanup EXIT

          # Each run stages a full source tree plus its own venv on the peer, so
          # the staging root grows without a reclaim step. cleanup() removes this
          # run's directory, but a cancelled job is SIGKILLed and never reaches
          # its EXIT trap — the age sweep is what reclaims those. The TTL must
          # stay well above this job's 60-minute timeout so a live run is never
          # swept out from under itself.
          ssh "${SSH_OPTS[@]}" "$REMOTE_TARGET" "
            mkdir -p '$POD_REMOTE_STAGING_ROOT'
            find '$POD_REMOTE_STAGING_ROOT' -mindepth 1 -maxdepth 1 -type d -mtime +${POD_REMOTE_STAGING_TTL_DAYS} -exec rm -rf {} + || true
            rm -rf '$REMOTE_WORKDIR' && mkdir -p '$REMOTE_WORKDIR'
          "
          rsync -a --delete -e "$RSYNC_SSH" \
            --exclude .git --exclude .venv --exclude build --exclude output \
            "$GITHUB_WORKSPACE/" "$REMOTE_TARGET:$REMOTE_WORKDIR/"

          ssh "${SSH_OPTS[@]}" "$REMOTE_TARGET" "
            set -eo pipefail
            cd '$REMOTE_WORKDIR'
            if [ -n '$REMOTE_PROXY_HOST' ] && ! (exec 3<>'/dev/tcp/$REMOTE_PROXY_HOST/$REMOTE_PROXY_PORT') 2>/dev/null; then
              echo '::error::POD_REMOTE_HTTP_PROXY=$POD_REMOTE_HTTP_PROXY is not reachable from machine $POD_REMOTE_MACHINE'
              exit 1
            fi
            export PYTHONPATH="\${PYTHONPATH:-}"
            export CMAKE_PREFIX_PATH="\${CMAKE_PREFIX_PATH:-}"
            export http_proxy='$POD_REMOTE_HTTP_PROXY' https_proxy='$POD_REMOTE_HTTPS_PROXY' no_proxy='$POD_REMOTE_NO_PROXY'
            export HTTP_PROXY='$POD_REMOTE_HTTP_PROXY' HTTPS_PROXY='$POD_REMOTE_HTTPS_PROXY' NO_PROXY='$POD_REMOTE_NO_PROXY'
            source '$POD_REMOTE_CANN_ENV'
            set -u
            python3 -m venv --system-site-packages .venv
            source .venv/bin/activate
            pip install --upgrade pip
            pip install '.[test]'
          "

          ssh "${SSH_OPTS[@]}" "$REMOTE_TARGET" "
            pkill -f 'python -m simpler.remote_l3_worker --host ${REMOTE_DAEMON_HOST} --port ${REMOTE_DAEMON_PORT}' || true
          " || true

          ssh "${SSH_OPTS[@]}" "$REMOTE_TARGET" "
            set -eo pipefail
            cd '$REMOTE_WORKDIR'
            export PYTHONPATH="\${PYTHONPATH:-}"
            export CMAKE_PREFIX_PATH="\${CMAKE_PREFIX_PATH:-}"
            source '$POD_REMOTE_CANN_ENV'
            set -u
            source .venv/bin/activate
            # The job-level timeouts are the parent's environment; ssh carries
            # no environment, so the peer would otherwise schedule against the
            # built-in defaults and the two halves of one run would disagree on
            # how long a stall may last.
            export SIMPLER_SCHEDULER_TIMEOUT_MS='$SIMPLER_SCHEDULER_TIMEOUT_MS'
            export SIMPLER_OP_EXECUTE_TIMEOUT_US='$SIMPLER_OP_EXECUTE_TIMEOUT_US'
            export SIMPLER_STREAM_SYNC_TIMEOUT_MS='$SIMPLER_STREAM_SYNC_TIMEOUT_MS'
            mkdir -p output/vector_add_mixed_l3/daemon-${POD_REMOTE_MACHINE}
            export ASCEND_PROCESS_LOG_PATH="\$PWD/output/vector_add_mixed_l3/daemon-${POD_REMOTE_MACHINE}"
            export SIMPLER_VECTOR_ADD_MIXED_L3_ROLE=machine${POD_REMOTE_MACHINE}
            export SIMPLER_VECTOR_ADD_MIXED_L3_HOST=${REMOTE_DAEMON_HOST}
            export SIMPLER_VECTOR_ADD_MIXED_L3_PORT=${REMOTE_DAEMON_PORT}
            bash examples/workers/l4/vector_add_mixed_l3/start_machine_daemon.sh
          " > "$RUN_DIR/daemon-${POD_REMOTE_MACHINE}/daemon.ssh.log" 2>&1 &
          REMOTE_SSH_PID=$!

          python - <<PYWAIT
          import socket
          import sys
          import time

          deadline = time.time() + ${POD_DAEMON_WAIT_S}
          while time.time() < deadline:
              try:
                  with socket.create_connection(("${REMOTE_DAEMON_HOST}", ${REMOTE_DAEMON_PORT}), timeout=2):
                      sys.exit(0)
              except OSError:
                  time.sleep(1)
          print("remote daemon did not become reachable", file=sys.stderr)
          sys.exit(1)
          PYWAIT

          export ASCEND_PROCESS_LOG_PATH="$RUN_DIR/parent-${POD_MACHINE}/ascend"
          export SIMPLER_VECTOR_ADD_MIXED_L3_REMOTE="${REMOTE_DAEMON_HOST}:${REMOTE_DAEMON_PORT}"
          export SIMPLER_VECTOR_ADD_MIXED_L3_LOCAL_DEVICES="$POD_LOCAL_DEVICES"
          export SIMPLER_VECTOR_ADD_MIXED_L3_REMOTE_DEVICES="$POD_REMOTE_DEVICES"
          export SIMPLER_VECTOR_ADD_MIXED_L3_SESSION_TIMEOUT="$POD_L3_SESSION_TIMEOUT_S"
          export SIMPLER_VECTOR_ADD_MIXED_L3_SESSION_LISTEN_HOST="$POD_L3_SESSION_LISTEN_HOST"

          timeout "${POD_SMOKE_TIMEOUT_S}s" bash examples/workers/l4/vector_add_mixed_l3/run_parent.sh

      # Both sides' device logs and the peer's daemon output land under the run
      # directory and stay on the runner otherwise. A device-side failure — a
      # scheduler timeout on the peer, say — names its sub-class only there, so
      # without this the run page shows the host traceback and nothing that
      # explains it.
      - name: Upload vector_add_mixed_l3 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-add-mixed-l3-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/vector_add_mixed_l3/pod-ci-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 7

  # ---------- Detect platform-specific changes (runs on GitHub server) ----------
  detect-changes:
    if: false
    runs-on: ubuntu-latest
    outputs:
      a2a3_changed: ${{ steps.check.outputs.a2a3_changed }}
      a5_changed: ${{ steps.check.outputs.a5_changed }}
      non_code_only: ${{ steps.check.outputs.non_code_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check file changes
        id: check
        run: |
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }})

          # Fail open, in ONE place. An empty diff means attribution is
          # impossible — a PR with no files, or base/head SHAs that did not
          # resolve — so nothing below can be trusted and every flag must say
          # "affected". Deciding this per-flag is how the axes drifted apart:
          # the emptiness test used to live inside the non_code_only branch
          # only, which left it false (UT and packaging ran) while both arch
          # flags independently came out false too (scene tests skipped).
          if [ -z "$FILES" ]; then
            echo "Empty diff: cannot attribute changes, running everything"
            echo "non_code_only=false" >> "$GITHUB_OUTPUT"
            echo "a2a3_changed=true" >> "$GITHUB_OUTPUT"
            echo "a5_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ONE definition of "changing this cannot change what the code does".
          # Every gate below derives from this set — see
          # .claude/rules/ci-change-detection.md before editing it. Membership
          # follows a file's effect, not its path: the docs toolchain counts
          # even where it sits outside docs/ (mkdocs.yml, workflows/docs.yml),
          # because docs.yml itself runs unconditionally on every PR and is the
          # whole gate for it. ci.yml is deliberately absent — a change to the
          # gates must run everything.
          NON_CODE='^(docs/|\.docs/|\.claude/|mkdocs\.yml$|\.github/workflows/docs\.yml$|\.gitignore$|\.pre-commit-config\.yaml$)|\.md$'

          # Non-code-only: pre-commit and docs.yml are the whole gate.
          CODE=$(echo "$FILES" | grep -vE "$NON_CODE" || true)
          if [ -z "$CODE" ]; then
            echo "non_code_only=true" >> "$GITHUB_OUTPUT"
            echo "No file here can change what the code does; pre-commit + docs are the whole gate"
          else
            echo "non_code_only=false" >> "$GITHUB_OUTPUT"
          fi

          # a2a3: skip only when ALL changed files are a5-only or non-code
          A5_ONLY='^(src/a5/|examples/a5/|tests/(st|ut/cpp)/a5/)'
          A2A3_REMAINING=$(echo "$FILES" | grep -vE "$A5_ONLY" | grep -vE "$NON_CODE" || true)

          if [ -n "$A2A3_REMAINING" ]; then
            echo "a2a3_changed=true" >> "$GITHUB_OUTPUT"
            echo "Files affecting a2a3:"
            echo "$A2A3_REMAINING"
          else
            echo "a2a3_changed=false" >> "$GITHUB_OUTPUT"
            echo "All changes are a5-only or non-code; skipping a2a3"
          fi

          # a5: skip only when ALL changed files are a2a3-only or non-code
          A2A3_ONLY='^(src/a2a3/|examples/a2a3/|tests/(st|ut/cpp)/a2a3/)'
          A5_REMAINING=$(echo "$FILES" | grep -vE "$A2A3_ONLY" | grep -vE "$NON_CODE" || true)

          if [ -n "$A5_REMAINING" ]; then
            echo "a5_changed=true" >> "$GITHUB_OUTPUT"
            echo "Files affecting a5:"
            echo "$A5_REMAINING"
          else
            echo "a5_changed=false" >> "$GITHUB_OUTPUT"
            echo "All changes are a2a3-only or non-code; skipping a5"
          fi

  # ---------- Unit tests (a5 hardware, Python + C++) ----------
  ut-a5:
    needs: [detect-changes, pre-commit]
    if: false
    runs-on: [self-hosted, a5]
    timeout-minutes: 30
    env:
      SIMPLER_SCHEDULER_TIMEOUT_MS: "2000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "3000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "4000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up environment
        run: |
          python3 -m venv --system-site-packages .venv
          source .venv/bin/activate
          pip install --upgrade pip
          # The host_runtime build and test-time kernels both resolve PTO-ISA
          # from pto_isa.pin, so they share one ISA revision.
          pip install '.[test]'

      - name: Run Python hardware unit tests (a5)
        run: |
          source .venv/bin/activate
          DEVICE_LIST=$(python -c "p='${DEVICE_RANGE}'.split('-'); s,e=p[0],p[-1]; print(','.join(str(i) for i in range(int(s),int(e)+1)))")
          task-submit --timeout 1800 --max-time 1800 --device "$DEVICE_LIST" --run "python -m pytest tests -m requires_hardware --platform a5 --device ${DEVICE_RANGE} -v"

      - name: Build and run C++ hardware unit tests (a5)
        run: |
          source .venv/bin/activate
          cmake -B tests/ut/cpp/build -S tests/ut/cpp -DSIMPLER_ENABLE_HARDWARE_TESTS=ON
          cmake --build tests/ut/cpp/build
          python3 -c "
          import json, os
          p = os.environ['DEVICE_RANGE'].split('-'); s, e = p[0], p[-1]  # tolerate a single id (no hyphen)
          npus = [{'id': str(i), 'slots': 1} for i in range(int(s), int(e)+1)]
          json.dump({'version': {'major': 1, 'minor': 0}, 'local': [{'npus': npus}]},
                    open('tests/ut/cpp/build/resources.json', 'w'))
          "
          DEVICE_LIST=$(python -c "p='${DEVICE_RANGE}'.split('-'); s,e=p[0],p[-1]; print(','.join(str(i) for i in range(int(s),int(e)+1)))")
          task-submit --timeout 1800 --max-time 1800 --device "$DEVICE_LIST" --run "ctest --test-dir tests/ut/cpp/build -L '^requires_hardware(_a5)?\$' --resource-spec-file $PWD/tests/ut/cpp/build/resources.json -j$(nproc) --output-on-failure"

      - name: Build cann-examples/query (CANN host-API smoke)
        run: |
          cd tools/cann-examples/query
          cmake -B build .
          cmake --build build
          ./build/query version

      - name: Build cann-examples/aicpu-device-query (device-side HAL probe smoke)
        run: |
          export CROSS=${ASCEND_HOME_PATH}/tools/hcc/bin/aarch64-target-linux-gnu
          cd tools/cann-examples/aicpu-device-query/device
          cmake -B build . -DCMAKE_C_COMPILER=${CROSS}-gcc -DCMAKE_CXX_COMPILER=${CROSS}-g++
          cmake --build build
          cd ../host
          cmake -B build .
          cmake --build build

      - name: Build cann-examples/aicpu-kernel-launch (dispatcher bootstrap smoke)
        run: |
          export CROSS=${ASCEND_HOME_PATH}/tools/hcc/bin/aarch64-target-linux-gnu
          cd tools/cann-examples/aicpu-kernel-launch/device
          cmake -B build . -DCMAKE_C_COMPILER=${CROSS}-gcc -DCMAKE_CXX_COMPILER=${CROSS}-g++
          cmake --build build
          cd ../host
          cmake -B build .
          cmake --build build

  st-onboard-a5:
    needs: [detect-changes, pre-commit]
    if: false
    runs-on: [self-hosted, a5]
    timeout-minutes: 60
    env:
      SIMPLER_SCHEDULER_TIMEOUT_MS: "2000"
      SIMPLER_OP_EXECUTE_TIMEOUT_US: "3000000"
      SIMPLER_STREAM_SYNC_TIMEOUT_MS: "4000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up environment
        run: |
          python3 -m venv --system-site-packages .venv
          source .venv/bin/activate
          pip install --upgrade pip
          # The host_runtime build and test-time kernels both resolve PTO-ISA
          # from pto_isa.pin, so they share one ISA revision.
          pip install '.[test]'

      - name: Run pytest scene tests (a5)
        run: |
          source .venv/bin/activate
          DEVICE_LIST=$(python -c "p='${DEVICE_RANGE}'.split('-'); s,e=p[0],p[-1]; print(','.join(str(i) for i in range(int(s),int(e)+1)))")
          PYTEST="python -m pytest examples tests/st --platform a5 --device ${DEVICE_RANGE} -v --require-pto-isa"
          task-submit --timeout 1800 --max-time 1800 --device "$DEVICE_LIST" --run "$PYTEST --pto-session-timeout 1200"

      # DFX per-feature smokes — hardware mirror of the st-sim-a5 set. The
      # race window in dep_gen only fires on real timing, so this row is
      # what would catch onboard-only regressions like the missing kernel.cpp
      # propagation #742 fixed.
      - name: dep_gen smoke
        run: |
          source .venv/bin/activate
          DEVICE_LIST=$(python -c "p='${DEVICE_RANGE}'.split('-'); s,e=p[0],p[-1]; print(','.join(str(i) for i in range(int(s),int(e)+1)))")
          PYTEST="python -m pytest tests/st/a5/tensormap_and_ringbuffer/dfx/dep_gen/test_dep_gen.py \
            --platform a5 --device ${DEVICE_RANGE} -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --enable-dep-gen"
          task-submit --timeout 1800 --max-time 1800 --device "$DEVICE_LIST" --run "$PYTEST"

      - name: l2_swimlane smoke
        run: |
          source .venv/bin/activate
          DEVICE_LIST=$(python -c "p='${DEVICE_RANGE}'.split('-'); s,e=p[0],p[-1]; print(','.join(str(i) for i in range(int(s),int(e)+1)))")
          PYTEST="python -m pytest tests/st/a5/tensormap_and_ringbuffer/dfx/l2_swimlane/ \
            --platform a5 --device ${DEVICE_RANGE} -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --enable-l2-swimlane --enable-dep-gen"
          task-submit --timeout 1800 --max-time 1800 --device "$DEVICE_LIST" --run "$PYTEST"

      - name: PMU smoke
        run: |
          source .venv/bin/activate
          DEVICE_LIST=$(python -c "p='${DEVICE_RANGE}'.split('-'); s,e=p[0],p[-1]; print(','.join(str(i) for i in range(int(s),int(e)+1)))")
          PYTEST="python -m pytest tests/st/a5/tensormap_and_ringbuffer/dfx/pmu/test_pmu.py \
            --platform a5 --device ${DEVICE_RANGE} -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --enable-pmu 2"
          task-submit --timeout 1800 --max-time 1800 --device "$DEVICE_LIST" --run "$PYTEST"

      - name: args_dump smoke
        run: |
          source .venv/bin/activate
          DEVICE_LIST=$(python -c "p='${DEVICE_RANGE}'.split('-'); s,e=p[0],p[-1]; print(','.join(str(i) for i in range(int(s),int(e)+1)))")
          PYTEST="python -m pytest tests/st/a5/tensormap_and_ringbuffer/dfx/args_dump/test_args_dump.py \
            --platform a5 --device ${DEVICE_RANGE} -p no:xdist --pto-session-timeout 600 \
            --require-pto-isa --dump-args"
          task-submit --timeout 1800 --max-time 1800 --device "$DEVICE_LIST" --run "$PYTEST"
